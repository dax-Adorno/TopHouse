name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tophouse_ci
          POSTGRES_USER: tophouse
          POSTGRES_PASSWORD: tophouse_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tophouse -d tophouse_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: tophouse_ci
      POSTGRES_USER: tophouse
      POSTGRES_PASSWORD: tophouse_ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check formatting with Black
        run: python -m black --check .

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Type check with mypy
        run: python -m mypy app tests

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Verify Alembic revision
        run: python -m alembic current

      - name: Run tests
        run: python -m pytest -q
